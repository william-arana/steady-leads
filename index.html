<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Steady Leads</title>
<meta name="description" content="Steady Leads: marketing for the trades.">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;1,400&family=Spline+Sans+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
/* Landing: one full-screen forest video, a purpose statement, nothing else. Single dark theme by choice. */
:root {
  color-scheme: dark;
  --cream: #F6F2E9;
  --leaf: #E9A176;
  --shade: rgba(14, 16, 12, 0.58);
  --serif: "EB Garamond", Garamond, Georgia, serif;
  --mono: "Spline Sans Mono", ui-monospace, Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: #14170F; color: var(--cream); font-family: var(--mono); overflow: hidden; }
.bg { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; background-size: cover; background-position: center; }
.shade { position: fixed; inset: 0; background: var(--shade); }
.frame { position: relative; height: 100%; display: flex; flex-direction: column; padding: 28px 48px; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 20px; }
.logo { display: flex; align-items: center; gap: 10px; color: var(--cream); text-decoration: none; font-family: "Trebuchet MS", "Lucida Grande", Arial, sans-serif; font-weight: 700; font-size: 17px; letter-spacing: .24em; text-transform: uppercase; }
.links { display: flex; gap: 28px; }
.links a, .foot { font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: var(--cream); text-decoration: none; }
.links a { padding: 8px 0; }
.links a:hover { text-decoration: underline; text-underline-offset: 5px; }
:focus-visible { outline: 2px solid var(--cream); outline-offset: 4px; }
.mid { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 30px; padding: 24px 0; }
.label { display: flex; align-items: center; gap: 18px; font-size: 11px; font-weight: 300; letter-spacing: .34em; text-transform: uppercase; color: rgba(246, 242, 233, .8); }
.label span { margin-right: -.34em; }
.label::before, .label::after { content: ""; width: 44px; height: 1px; background: rgba(246, 242, 233, .45); }
h1 { margin: 0; font-family: var(--serif); font-weight: 400; font-size: clamp(27px, 3.7vw, 40px); line-height: 1.32; letter-spacing: -.01em; max-width: 15.5em; text-wrap: balance; }
h1 em { color: var(--leaf); }
.foot { align-self: flex-end; }
@media (max-width: 600px) { .frame { padding: 22px 20px; } .logo { font-size: 14px; letter-spacing: .18em; } .links { gap: 18px; } }
</style>
</head>
<body>
<video class="bg" id="bg" muted loop playsinline preload="auto" aria-hidden="true" tabindex="-1"></video>
<div class="shade"></div>
<div class="frame">
  <div class="top">
    <a class="logo" href="home.html" aria-label="Steady Leads home">
      <svg width="30" height="30" viewBox="0 0 24 24" aria-hidden="true"><g transform="rotate(35 12 12)"><path fill-rule="evenodd" d="M12 2C18.5 5.5 20.5 12.5 12 20.5C3.5 12.5 5.5 5.5 12 2ZM11.4 6V19H12.6V6Z" fill="#F6F2E9"/><path d="M12 19.5V23.5" stroke="#F6F2E9" stroke-width="1.6" stroke-linecap="round"/></g></svg>
      Steady Leads
    </a>
    <div class="links">
      <a href="home.html" id="l-home">Home</a>
      <a href="home.html#contact" id="l-contact">Contact</a>
    </div>
  </div>
  <main class="mid">
    <div class="label"><span id="l-label">Purpose</span></div>
    <h1 id="l-purpose">Give every good trades shop a <em>steady</em> flow of work, earned honestly.</h1>
  </main>
  <div class="foot">© Steady Leads</div>
</div>
<script>
const pick = "forest-2";
const v = document.getElementById("bg");
v.poster = "assets/" + pick + ".jpg";
v.style.backgroundImage = "url(assets/" + pick + ".jpg)";
const still = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
if (!still) {
  v.src = "assets/" + pick + ".mp4";
  const p = v.play();
  if (p && p.catch) p.catch(() => {});
}
// Follow the language chosen on the rest of the site.
let lang = null;
try { lang = localStorage.getItem("sl-lang"); } catch (e) {}
if (lang === "es") {
  document.documentElement.lang = "es";
  document.getElementById("l-home").textContent = "Inicio";
  document.getElementById("l-contact").textContent = "Contacto";
  document.getElementById("l-label").textContent = "Propósito";
  document.getElementById("l-purpose").innerHTML = "Darle a cada buen negocio de oficios un flujo <em>constante</em> de trabajo, ganado con honestidad.";
}
</script>
</body>
</html>
